<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nostalgic Engine</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <canvas id="scene" aria-label="3D world" tabindex="0"></canvas>

    <div id="lobby" class="lobby">
      <header class="brand">
        <div class="brand-title">
          <h1 class="brand-name">Nostalgic Engine</h1>
          <p class="brand-tagline">Reliving your best memories</p>
        </div>
        <div class="brand-credit">
          <img class="brand-logo" src="/mint-logo.svg" alt="" width="28" height="28" />
          <span class="brand-credit-text">Built on Mint</span>
        </div>
      </header>

      <div class="panel">
        <label id="drop" class="drop" for="file-input" tabindex="0">
          <span class="drop-title">Drop photos of a room or place</span>
          <span class="drop-sub">Several photos of the same place become one world you can walk inside.</span>
          <input id="file-input" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden />
        </label>
        <p id="upload-note" class="note" hidden></p>

        <div id="import" class="look" hidden>
          <label class="look-label" for="import-link"
            >Already made a world in Mint? Paste its link or id.</label
          >
          <div class="look-row">
            <input
              id="import-link"
              class="look-input"
              type="text"
              inputmode="url"
              autocomplete="off"
              spellcheck="false"
              maxlength="200"
              placeholder="https://mint.gg/chat/…"
            />
            <button id="import-add" class="btn primary" type="button">Add</button>
          </div>
        </div>

        <section id="photos-box" class="box" hidden>
          <h2 class="box-title">Photos<span id="photos-count" class="box-count"></span></h2>
          <ul id="uploads" class="list" aria-label="Photos not yet built into a world"></ul>
          <label class="look" for="look-prompt">
            <span class="look-label">How should it look? Optional, applies to the next world you generate.</span>
            <textarea
              id="look-prompt"
              class="look-input"
              rows="2"
              maxlength="1200"
              placeholder="Golden hour light, warm timber and terracotta, softly worn and lived in"
            ></textarea>
          </label>
          <div id="batch-bar" class="batch-bar" hidden>
            <span id="batch-summary" class="batch-summary"></span>
            <button id="batch-clear" class="btn" type="button">Clear</button>
            <button id="batch-generate" class="btn primary" type="button">Generate</button>
          </div>
        </section>

        <section id="progress-box" class="box" hidden>
          <h2 class="box-title">In progress<span id="progress-count" class="box-count"></span></h2>
          <ul id="progress" class="list" aria-label="Worlds being built"></ul>
        </section>

        <section id="worlds-box" class="box" hidden>
          <h2 class="box-title">Environments<span id="worlds-count" class="box-count"></span></h2>
          <ul id="worlds" class="list" aria-label="Finished worlds"></ul>
        </section>
      </div>
    </div>

    <div id="hud" class="hud" hidden>
      <div id="status" class="status" role="status" hidden></div>
      <div class="controls">
        <span id="hint" class="hint">Click to look · WASD move · Shift run · Esc release</span>
        <button id="retry" class="btn" type="button" hidden>Retry</button>
        <button id="record" class="btn" type="button" title="Record a flight, then render it as a video (R)">Record</button>
        <button id="exit" class="btn" type="button">Exit</button>
        <button
          id="hud-toggle"
          class="btn hud-toggle"
          type="button"
          aria-expanded="true"
          title="Hide the bar"
          aria-label="Hide the bar"
        >
          ▾
        </button>
      </div>
    </div>

    <div id="export" class="export" role="dialog" aria-labelledby="export-title" hidden>
      <div class="export-card">
        <div id="export-title" class="export-title">Rendering your video</div>
        <div id="export-detail" class="export-detail"></div>
        <div class="export-bar" aria-hidden="true"><div id="export-fill" class="export-fill"></div></div>
        <div class="export-actions">
          <button id="export-cancel" class="btn" type="button">Cancel</button>
          <button id="export-save" class="btn primary" type="button" hidden>Save video</button>
          <button id="export-close" class="btn" type="button" hidden>Close</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
